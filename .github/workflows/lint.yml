name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: luacheck and XML
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install luacheck and xmllint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends lua-check libxml2-utils >/dev/null
          luacheck --version

      - name: luacheck
        run: luacheck . --formatter plain --codes

      - name: XML is well-formed
        run: xmllint --noout SimplePetTarget.xml Libs/LibEditMode/embed.xml
