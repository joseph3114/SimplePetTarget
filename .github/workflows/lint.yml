name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: luacheck and XML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      - uses: leafo/gh-actions-luarocks@v4

      - name: Install luacheck
        run: luarocks install luacheck

      - name: luacheck
        run: luacheck . --formatter plain --codes

      - name: XML is well-formed
        run: |
          sudo apt-get install -y --no-install-recommends libxml2-utils >/dev/null
          xmllint --noout SimplePetTarget.xml Libs/LibEditMode/embed.xml
