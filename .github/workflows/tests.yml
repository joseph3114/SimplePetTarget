name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: WoW API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lua 5.1, the language version the game runs.
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      # Prints each test, adds a table of them to the run's summary page and marks failures on
      # their lines in the code.
      - name: Run tests
        run: lua tests/run.lua --junit test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
